name: Unpack site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the zip into the repo root
        run: |
          set -e
          unzip -o 435a5340-e9d6-4a85-95ea-7289207a2f56.zip
          rm 435a5340-e9d6-4a85-95ea-7289207a2f56.zip
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add SPHERO static site files and remove the zip"
          git push
